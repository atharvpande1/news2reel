# Production, single host:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Published on loopback only — put a reverse proxy in front for anything else.
services:
  db:
    env_file: .env.prod

  api:
    env_file: .env.prod
    ports:
      - "127.0.0.1:8000:8000"
