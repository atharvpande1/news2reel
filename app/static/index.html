<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Feedcast</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/app.css" />
    <!-- Inline so the app has an identity in the tab without a request that 404s. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='5' fill='%2317181c'/%3E%3Crect x='7' y='9' width='18' height='3' fill='%23fff'/%3E%3Crect x='7' y='15' width='11' height='2.5' fill='%23006d9c'/%3E%3Crect x='7' y='20' width='14' height='2.5' fill='%23b21e5f'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <header class="masthead">
      <div class="shell">
        <div class="masthead__inner">
          <span class="wordmark">Feedcast</span>
          <button type="button" class="picker" id="city-picker" aria-haspopup="dialog" hidden>
            <span id="city-name"></span>
            <span class="picker__caret" aria-hidden="true">▾</span>
          </button>
          <span class="masthead__where" id="where"></span>
          <button type="button" class="btn btn--quiet masthead__logout" id="logout" hidden>
            Log out
          </button>
        </div>
        <nav class="nav" aria-label="Sections" hidden>
          <button type="button" class="nav__link" data-tab="discover">Discover</button>
          <button type="button" class="nav__link" data-tab="gallery">Gallery</button>
          <button type="button" class="nav__link" data-tab="cities">Cities</button>
        </nav>
      </div>
    </header>

    <main class="shell view" id="view"></main>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
