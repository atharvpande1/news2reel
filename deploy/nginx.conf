# Feedcast behind nginx on the AlmaLinux host. Install as
# /etc/nginx/conf.d/feedcast.conf and replace every feedcast.example.com.
#
# nginx owns what only makes sense at the edge: TLS, HSTS, the request-size
# cap and the login rate limit (the client IP is only real here). The app sets
# its own CSP / frame / nosniff / referrer headers on every response.
#
# The certificate must exist before this file is loaded — issue it first with
# certbot standalone (README, "Deploy"), or `nginx -t` fails on the paths below.

# Login brute force: 10 attempts a minute per client IP, a burst of 5 on top.
# Argon2 already makes each guess slow; this makes them few.
limit_req_zone $binary_remote_addr zone=feedcast_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name feedcast.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name feedcast.example.com;

    ssl_certificate /etc/letsencrypt/live/feedcast.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/feedcast.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;
    # Server level only: an add_header inside a location would silently drop
    # this one there.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The largest request is the carousel zip: up to 20MB of JPEGs, ~27MB once
    # base64'd into JSON. Anything bigger is refused here, before the app
    # buffers it.
    client_max_body_size 32m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # A city refresh polls up to five feeds at 10s read timeouts each, with
    # redirects; comfortably under this.
    proxy_read_timeout 90s;

    location = /api/v1/auth/login {
        limit_req zone=feedcast_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}
